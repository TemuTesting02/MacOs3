name: MacVNC

on:
  workflow_dispatch:

jobs:
  build:
    name: MacVNC
    runs-on: macos-latest

    steps:

      # ==============================
      # Tailscale
      # ==============================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ==============================
      # Create temporary VNC account
      # ==============================
      - name: Create Temporary VNC User
        run: |
          VNC_USER="vncuser"

          # Generate temporary password
          VNC_PASS=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 16)

          echo "VNC_USER=$VNC_USER" >> "$GITHUB_ENV"
          echo "VNC_PASS=$VNC_PASS" >> "$GITHUB_ENV"

          # Create user
          sudo sysadminctl \
            -addUser "$VNC_USER" \
            -fullName "Temporary VNC User" \
            -password "$VNC_PASS"

          # Allow this user to use Screen Sharing
          sudo dseditgroup \
            -o edit \
            -a "$VNC_USER" \
            -t user \
            com.apple.access_screensharing

      # ==============================
      # Enable macOS Screen Sharing
      # ==============================
      - name: Enable Screen Sharing
        run: |
          sudo launchctl enable system/com.apple.screensharing

          sudo launchctl bootstrap system \
            /System/Library/LaunchDaemons/com.apple.screensharing.plist \
            2>/dev/null || true

          sudo launchctl kickstart -k \
            system/com.apple.screensharing

          sleep 3

      # ==============================
      # Display connection information
      # ==============================
      - name: VNC Connection Information
        run: |
          IP=$(tailscale ip -4)

          echo ""
          echo "======================================"
          echo "        REALVNC CONNECTION"
          echo "======================================"
          echo ""
          echo "Server:"
          echo "$IP::5900"
          echo ""
          echo "Username:"
          echo "$VNC_USER"
          echo ""
          echo "Password:"
          echo "$VNC_PASS"
          echo ""
          echo "======================================"

      # ==============================
      # Keep Mac alive
      # ==============================
      - name: MacOS System running...
        run: |
          echo "MacOS runner is ready."
          echo "Keep this workflow running."

          while true; do
            echo "$(date): MacOS runner alive"
            sleep 60
          done
